name: FastBoot CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastboot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubicloud-standard-8
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish --no-plugins
      - name: Validate Python tooling
        run: python3 -m compileall -q dev
      - name: Lint PHP source and fixtures
        run: find src dev -name '*.php' -print0 | xargs -0 -n1 php -l

  integration:
    name: Magento 2.4.8 / PHP ${{ matrix.php }}
    runs-on: ubicloud-standard-8
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MAGENTO_ROOT: ${{ github.workspace }}/../fastboot-ci-magento
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_PROCESS_TIMEOUT: '600'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, ftp, gd, intl, mbstring, pdo_mysql, redis, soap, sodium, xsl, zip
          ini-values: memory_limit=1G
          coverage: none
          tools: composer:v2
      - name: Prepare public-source Magento fixture
        run: python3 dev/ci/prepare.py --root "$MAGENTO_ROOT"
      - name: Unit regressions
        run: php "$MAGENTO_ROOT/vendor/bin/phpunit" --no-configuration --bootstrap dev/tests/bootstrap.php --log-junit .ci/unit.xml src
      - name: Schema publication, TTL and failure invariants
        run: |
          php dev/tests/schema-l1/tests.php
          php dev/tests/schema-l1/edge-cases.php
          python3 dev/tests/schema-l1/concurrency.py
          python3 dev/tests/schema-l1/redis-failure.py
      - name: Repeat schema and unit regressions without ext-redis
        run: |
          python3 dev/tests/without-redis.py -- sh -ec '
            php "$MAGENTO_ROOT/vendor/bin/phpunit" --no-configuration --bootstrap dev/tests/bootstrap.php src
            php dev/tests/schema-l1/tests.php
            php dev/tests/schema-l1/edge-cases.php
            python3 dev/tests/schema-l1/concurrency.py
            python3 dev/tests/schema-l1/redis-failure.py
          '
      - name: Compile fresh Magento DI metadata
        working-directory: ${{ env.MAGENTO_ROOT }}
        run: php bin/magento setup:di:compile
      - name: Build and install a reproducible Composer artifact
        run: |
          python3 dev/release/build.py --version 0.0.0-rc0 --output .ci/artifacts
          python3 dev/release/build.py --version 0.0.0-rc0 --output .ci/rebuild
          cmp .ci/artifacts/*.zip .ci/rebuild/*.zip
          python3 dev/release/install-smoke.py --archive .ci/artifacts/graphcommerce-magento-fast-boot-0.0.0-rc0.zip --magento-root "$MAGENTO_ROOT" --output .ci/install
          python3 dev/tests/without-redis.py -- python3 dev/release/install-smoke.py --archive .ci/artifacts/graphcommerce-magento-fast-boot-0.0.0-rc0.zip --magento-root "$MAGENTO_ROOT" --output .ci/install-no-redis
      - name: Collect fixture logs
        if: always()
        run: |
          mkdir -p .ci/logs
          if [ -d "$MAGENTO_ROOT/var/log" ]; then cp -R "$MAGENTO_ROOT/var/log/." .ci/logs/; fi
      - name: Retain test and package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fastboot-php-${{ matrix.php }}
          path: |
            .ci/unit.xml
            .ci/artifacts/
            .ci/logs/
          if-no-files-found: ignore
          retention-days: 7
